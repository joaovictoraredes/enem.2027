<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131c"><title>ENEM 2027 | Plano de estudos</title>
<style>
:root{color-scheme:dark;--bg:#0d1018;--panel:#151a26;--panel2:#1b2231;--line:#2a3345;--text:#edf1f8;--muted:#9aa6ba;--accent:#9b8cff;--green:#64d6a2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#222044 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{max-width:1080px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{font-size:clamp(28px,5vw,42px);line-height:1.08;margin:6px 0}p,.muted{color:var(--muted)}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 12px;color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat,.phase,.week,.empty{background:linear-gradient(145deg,var(--panel),#121722);border:1px solid var(--line);border-radius:16px}.stat{padding:16px}.stat strong{display:block;font-size:25px}.stat span{font-size:12px;color:var(--muted)}.progress{height:8px;background:#293143;border-radius:20px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--green))}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit}.toolbar input{flex:1;min-width:180px}button{cursor:pointer}button:hover{border-color:var(--accent)}.phase{margin:14px 0;overflow:hidden}.phase-head,.week-head{padding:15px 17px;display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer}.phase-head h2{font-size:17px;margin:0}.phase-body{padding:0 14px 14px}.week{margin:10px 0;background:var(--panel2);overflow:hidden}.week-body{padding:4px 14px 14px}.subject{margin:12px 0}.subject h3{font-size:13px;color:var(--accent);margin:0 0 7px;text-transform:uppercase}.task{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #293143}.task input{accent-color:var(--green);width:17px;height:17px}.task input:checked+label{color:#8995a8;text-decoration:line-through}.empty{padding:24px;text-align:center}.empty h2{margin-top:0}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.wrap{padding:22px 13px 45px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Plano de preparação</div><h1>ENEM 2027</h1><p>Seu progresso, semana a semana.</p></div><span class="pill">Progresso salvo neste dispositivo</span></header>
<section class="stats"><div class="stat"><span>PROGRESSO GERAL</span><strong id="pct">0%</strong><div class="progress"><i id="bar"></i></div></div><div class="stat"><span>ASSUNTOS CONCLUÍDOS</span><strong id="done">0 / 0</strong></div><div class="stat"><span>SEMANAS</span><strong id="weeks">0 / 50</strong></div></section>
<div class="toolbar"><input id="search" placeholder="Buscar assunto ou disciplina…"><select id="phaseFilter"><option value="all">Todas as fases</option></select><button id="expand">Recolher tudo</button><button id="reset">Limpar progresso</button></div><div id="content"></div><footer>As marcações ficam salvas neste navegador. O cronograma completo será carregado em schedule-data.js.</footer></main>
<script src="schedule-data.js"></script><script>
const phases=window.STUDY_PLAN||[],KEY='enem2027-progress-v1';let done={};try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};const $=x=>document.getElementById(x);let expanded=true;
const key=(p,w,s,t)=>[p,w,s,t].join('-');function totals(){let n=0,d=0,w=0;phases.forEach((p,pi)=>p.weeks.forEach((a,wi)=>{w++;a.subjects.forEach((s,si)=>s.tasks.forEach((t,ti)=>{n++;if(done[key(pi,wi,si,ti)])d++}))}));return{n,d,w}}
function update(){let x=totals(),v=x.n?Math.round(x.d/x.n*100):0;$('pct').textContent=v+'%';$('bar').style.width=v+'%';$('done').textContent=x.d+' / '+x.n;$('weeks').textContent=x.w+' / 50'}
function render(){let q=$('search').value.toLocaleLowerCase('pt-BR'),f=$('phaseFilter').value,root=$('content');root.innerHTML='';if(!phases.length){root.innerHTML='<section class="empty"><h2>Estrutura do painel publicada</h2><p>O site já está preparado. Falta carregar os tópicos do cronograma de 50 semanas no arquivo de dados para habilitar os checklists e os cálculos de progresso.</p></section>';update();return}
 phases.forEach((p,pi)=>{if(f!=='all'&&f!==''+pi)return;let box=document.createElement('section');box.className='phase';let head=document.createElement('div');head.className='phase-head';head.innerHTML='<h2>'+p.name+'</h2><span class="muted">Abrir / recolher⌄</span>';let body=document.createElement('div');body.className='phase-body';head.onclick=()=>body.hidden=!body.hidden;
 p.weeks.forEach((w,wi)=>{let wk=document.createElement('article');wk.className='week';let wh=document.createElement('div');wh.className='week-head';let total=w.subjects.reduce((a,s)=>a+s.tasks.length,0),n=0;w.subjects.forEach((s,si)=>s.tasks.forEach((t,ti)=>{if(done[key(pi,wi,si,ti)])n++}));wh.innerHTML='<strong>'+w.name+'</strong><span class="muted">'+n+'/'+total+' concluídos</span>';let wb=document.createElement('div');wb.className='week-body';wh.onclick=()=>wb.hidden=!wb.hidden;
 w.subjects.forEach((s,si)=>{let items=s.tasks.map((t,ti)=>({t,ti})).filter(x=>(s.name+' '+x.t).toLocaleLowerCase('pt-BR').includes(q));if(!items.length)return;let group=document.createElement('section');group.className='subject';let h=document.createElement('h3');h.textContent=s.name;group.append(h);items.forEach(({t,ti})=>{let k=key(pi,wi,si,ti),row=document.createElement('div');row.className='task';let cb=document.createElement('input');cb.type='checkbox';cb.checked=!!done[k];let label=document.createElement('label');label.textContent=t;cb.onchange=()=>{done[k]=cb.checked;localStorage.setItem(KEY,JSON.stringify(done));render()};row.append(cb,label);group.append(row)});wb.append(group)});wk.append(wh,wb);body.append(wk)});box.append(head,body);root.append(box)});update()}
phases.forEach((p,i)=>{let o=document.createElement('option');o.value=i;o.textContent=p.name;$('phaseFilter').append(o)});$('search').oninput=render;$('phaseFilter').onchange=render;$('expand').onclick=()=>{expanded=!expanded;document.querySelectorAll('.phase-body,.week-body').forEach(x=>x.hidden=!expanded);$('expand').textContent=expanded?'Recolher tudo':'Expandir tudo'};$('reset').onclick=()=>{if(confirm('Apagar todas as marcações deste navegador?')){done={};localStorage.removeItem(KEY);render()}};render();
</script></body></html>
